[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "spindle-app"
version = "0.1.0"
description = "Spindle: User-Side Privacy Gateway for AI Agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.34.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.115.0",
    "jinja2>=3.1.0",
    "mcp>=1.2.0",
    "openai>=1.40.0",
    "pydantic>=2.8.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.0",
    "uvicorn>=0.30.0",
]

[project.scripts]
spindle-mcp = "spindle.mcp_server:main"
spindle-dashboard = "spindle.dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/spindle"]
