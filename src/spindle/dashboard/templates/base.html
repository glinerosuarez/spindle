<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Spindle | AI Email Privacy Gateway{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --border: #334155;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #38bdf8;
      --primary-hover: #0284c7;
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --gray: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 1.5rem;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 1.5rem;
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.05em;
      color: var(--primary);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .badge {
      display: inline-block;
      padding: 0.2rem 0.6rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .badge-allow { background-color: #064e3b; color: #34d399; }
    .badge-ask { background-color: #78350f; color: #fbbf24; }
    .badge-deny { background-color: #374151; color: #9ca3af; }
    .badge-quarantine { background-color: #7f1d1d; color: #f87171; border: 1px solid #ef4444; }
    .badge-passthrough { background-color: #991b1b; color: #ffffff; font-weight: 900; animation: pulse 2s infinite; }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    .chip {
      display: inline-block;
      padding: 0.15rem 0.5rem;
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.7rem;
      color: #38bdf8;
      margin-right: 0.25rem;
    }
    .chip-exposed {
      color: #f87171;
      border-color: #991b1b;
      background-color: #450a0a;
    }

    .grid-container {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 1.5rem;
    }
    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .card-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #e2e8f0;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.875rem;
    }
    th {
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 0.5rem;
      font-weight: 600;
    }
    td {
      padding: 0.75rem 0.5rem;
      border-bottom: 1px solid #283548;
      vertical-align: middle;
    }
    tr.clickable:hover {
      background-color: #263349;
      cursor: pointer;
    }
    .btn {
      cursor: pointer;
      padding: 0.4rem 0.8rem;
      border-radius: 4px;
      border: none;
      font-weight: 600;
      font-size: 0.8rem;
      transition: background-color 0.15s;
    }
    .btn-approve { background-color: var(--success); color: #fff; }
    .btn-approve:hover { background-color: #059669; }
    .btn-deny { background-color: var(--danger); color: #fff; margin-left: 0.5rem; }
    .btn-deny:hover { background-color: #dc2626; }
    .btn-primary { background-color: var(--primary); color: #0f172a; }
    .btn-primary:hover { background-color: var(--primary-hover); }

    pre {
      background-color: #0f172a;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    .redaction-mark {
      background-color: #0284c7;
      color: #fff;
      padding: 0.1rem 0.3rem;
      border-radius: 3px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">
      <span>🛡️ Spindle</span>
      <span style="font-size: 0.85rem; font-weight: normal; color: var(--text-muted);">| Agent Privacy Gateway</span>
    </div>
    <div style="font-size: 0.85rem; color: var(--text-muted);">
      Active Target: <strong style="color: var(--primary);">Alex Rivera (Northwind)</strong>
      &nbsp;|&nbsp;
      Status: <span style="color: var(--success); font-weight: bold;">● Active & Guarded</span>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
